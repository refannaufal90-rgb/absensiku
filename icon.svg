<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Calendar Base -->
  <rect x="96" y="128" width="320" height="288" rx="36" fill="#ffffff" fill-opacity="0.1" />
  <rect x="96" y="128" width="320" height="88" rx="36" fill="#ffffff" fill-opacity="0.25" />
  <rect x="96" y="180" width="320" height="36" fill="#ffffff" fill-opacity="0.25" />

  <!-- Calendar Rings -->
  <rect x="156" y="96" width="28" height="64" rx="14" fill="#ffffff" />
  <rect x="328" y="96" width="28" height="64" rx="14" fill="#ffffff" />

  <!-- Checkmark Badge -->
  <circle cx="340" cy="340" r="76" fill="url(#checkGrad)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.3))" />
  <path d="M304 340 L328 364 L376 316" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Clock Mini Icon inside Calendar -->
  <circle cx="210" cy="310" r="48" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <polyline points="210,282 210,310 230,310" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
</svg>
