<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14BBA6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0D9488" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners (120px) -->
  <rect width="512" height="512" rx="120" fill="url(#tealGrad)" filter="url(#softShadow)" />

  <!-- Inner Soft Square Ring -->
  <rect x="76" y="76" width="360" height="360" rx="90" fill="#ffffff" fill-opacity="0.15" />

  <!-- Clean Bold White Checkmark in Center -->
  <path 
    d="M170 265 L235 330 L350 195" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="44" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
</svg>
